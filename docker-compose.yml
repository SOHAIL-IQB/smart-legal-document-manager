services:
  db:
    image: postgres:16
    container_name: smart-legal-document-manager-db
    environment:
      POSTGRES_DB: smart_legal_document_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_legal_document_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: smart-legal-document-manager-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/smart_legal_document_manager
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"

volumes:
  postgres_data:
