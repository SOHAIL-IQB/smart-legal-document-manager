name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        # Ratchet from CONSTRAINTS.md: measured 98.07% on 2026-11-23, 0.5% tolerance.
        run: pytest --cov --cov-fail-under=97.5

  backend-postgres:
    # Same suite on real PostgreSQL: runs the row-lock concurrency test and checks migrations.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sldm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sldm_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Migrations apply, roll back, and match the models
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Test
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
        run: pytest

  security:
    # External checks (CONSTRAINTS.md): they judge the code against outside data, not our own tests.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history for the secret scan and the floor guard)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependency audit (pip-audit, exits 1 on any known vulnerability)
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt

      - name: Secret scan of the full history (gitleaks, output redacted)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact -v

      - name: Floor guard on the pushed commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}"; then
            base="$BEFORE"
          else
            base="HEAD~1"
          fi
          echo "Comparing against $base"
          python scripts/floor_guard.py --base "$base"

